:root {
  --bg: #ffffff;
  --ink: #000000;
  --ink-2: #5f6571;
  --rule: #d5d9e1;
  --frame: #dfe6f6;
  --frame-edge: #c4cfeb;
  --board: #ffffff;
  --cell: #eef2fa;
  --block: #a9b1c0;
  --block-edge: #475063;
  --target: #4270f0;
  --target-edge: #2747b6;
  --veil: rgba(255, 255, 255, 0.78);
  --frame-pad: 12px;
  --board-pad: 8px;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317;
    --ink: #f2f3f5;
    --ink-2: #9aa1ad;
    --rule: #30353e;
    --frame: #262d3f;
    --frame-edge: #1b2130;
    --board: #171a20;
    --cell: #20242d;
    --block: #6c7486;
    --block-edge: #383f4e;
    --target: #5a82f5;
    --target-edge: #3457c8;
    --veil: rgba(23, 26, 32, 0.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111317;
  --ink: #f2f3f5;
  --ink-2: #9aa1ad;
  --rule: #30353e;
  --frame: #262d3f;
  --frame-edge: #1b2130;
  --board: #171a20;
  --cell: #20242d;
  --block: #6c7486;
  --block-edge: #383f4e;
  --target: #5a82f5;
  --target-edge: #3457c8;
  --veil: rgba(23, 26, 32, 0.8);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
main { max-width: 440px; margin: 0 auto; padding: 24px 16px 32px; }

.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-size: 24px; font-weight: 700; line-height: 1.2; letter-spacing: -0.025em; }
.levels { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--rule); border-radius: 10px; }
.levels button {
  appearance: none;
  border: 0;
  border-radius: 7px;
  padding: 8px 11px;
  background: transparent;
  color: var(--ink-2);
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  line-height: 1;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.levels button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.count { display: flex; gap: 22px; margin: 22px 2px 12px; font-size: 14px; color: var(--ink-2); }
.count span { display: inline-flex; align-items: baseline; }
.count b {
  margin-left: 7px;
  color: var(--ink);
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 18px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.stage { overflow: hidden; padding-bottom: 8px; }
.frame {
  position: relative;
  padding: var(--frame-pad);
  border-radius: 22px;
  background: var(--frame);
  box-shadow: 0 6px 0 var(--frame-edge);
}
.board { position: relative; padding: var(--board-pad); border-radius: 14px; background: var(--board); }
.grid {
  position: relative;
  aspect-ratio: 1 / 1;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
.exit {
  position: absolute;
  left: 100%;
  top: calc(100% / 3);
  width: calc(var(--frame-pad) + var(--board-pad));
  height: calc(100% / 6);
  background: var(--board);
}
.cell { position: absolute; width: calc(100% / 6); height: calc(100% / 6); padding: 0.7%; }
.cell::before { content: ""; display: block; width: 100%; height: 100%; border-radius: 8px; background: var(--cell); }

.piece {
  --fill: var(--block);
  --edge: var(--block-edge);
  position: absolute;
  z-index: 2;
  padding: 0.7%;
  cursor: grab;
  touch-action: none;
  will-change: transform;
  transition: transform 0.16s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.piece > span {
  display: block;
  width: 100%;
  height: 100%;
  border-radius: 8px;
  background: var(--fill);
  box-shadow: inset 0 -4px 0 var(--edge);
}
.piece.target { --fill: var(--target); --edge: var(--target-edge); }
.piece.dragging { z-index: 3; cursor: grabbing; transition: none; }
.piece.dragging > span { filter: brightness(1.06); }
.piece.hinted > span { box-shadow: inset 0 -4px 0 var(--edge), 0 0 0 2px var(--board), 0 0 0 4px var(--ink); }
.piece.exiting { transition: transform 0.5s cubic-bezier(0.5, 0, 0.75, 0), opacity 0.5s ease-in; opacity: 0; }
.grid.instant .piece { transition: none; }

.ghost { position: absolute; z-index: 1; padding: 0.7%; pointer-events: none; }
.ghost::before {
  content: "";
  display: block;
  width: 100%;
  height: 100%;
  border: 2px dashed var(--ink-2);
  border-radius: 8px;
}

.veil {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  background: var(--veil);
  color: var(--ink);
  font-size: 15px;
  font-weight: 600;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.15s, visibility 0s linear 0.15s;
}
.veil.show { opacity: 1; visibility: visible; transition: opacity 0.15s; }

.status {
  min-height: 3em;
  margin: 14px 4px 14px;
  color: var(--ink-2);
  font-size: 15px;
  line-height: 1.5;
  text-align: center;
  word-break: keep-all;
  text-wrap: balance;
}
.status.strong { color: var(--ink); font-weight: 600; }

.controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.controls button {
  height: 48px;
  border: 1px solid var(--rule);
  border-radius: 12px;
  background: var(--bg);
  color: var(--ink);
  font: inherit;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.controls .primary { grid-column: 1 / -1; border-color: var(--ink); background: var(--ink); color: var(--bg); }
.controls button:disabled { opacity: 0.35; cursor: default; }
.controls button:active:not(:disabled) { transform: translateY(1px); }
@media (hover: hover) {
  .controls button:not(:disabled):hover { border-color: var(--ink-2); }
  .controls .primary:not(:disabled):hover { opacity: 0.86; }
}
button:focus-visible { outline: 2px solid var(--target); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  .piece, .piece.exiting, .veil, .veil.show { transition-duration: 0.01s; }
}
</style>
</head>
<body>
<main>
  <div class="head">
    <h1>블록 탈출</h1>
    <div class="levels" role="group" aria-label="난이도">
      <button type="button" data-level="easy" aria-pressed="false">쉬움</button>
      <button type="button" data-level="normal" aria-pressed="true">보통</button>
      <button type="button" data-level="hard" aria-pressed="false">어려움</button>
    </div>
  </div>

  <div class="count">
    <span>이동<b id="moves">0</b></span>
    <span>최소<b id="min">–</b></span>
  </div>

  <div class="stage">
    <div class="frame">
      <div class="board">
        <div class="grid" id="grid" aria-label="게임판">
          <div class="exit" aria-hidden="true"></div>
          <div class="veil" id="veil">퍼즐 만드는 중…</div>
        </div>
      </div>
    </div>
  </div>

  <p class="status" id="status" aria-live="polite">블록을 밀어서 파란 블록을 오른쪽 출구로 빼내세요.</p>

  <div class="controls">
    <button type="button" id="undo">되돌리기</button>
    <button type="button" id="reset">처음부터</button>
    <button type="button" id="hint">힌트</button>
    <button type="button" id="new" class="primary">새 게임</button>
  </div>
</main>

<script>
(function () {
  'use strict';

  // ENGINE START
  const N = 6;
  const EXIT_ROW = 2;
  const GOAL = N - 2;

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function randomSeed() {
    try {
      const b = new Uint32Array(1);
      crypto.getRandomValues(b);
      return b[0];
    } catch (e) {
      return (Math.random() * 4294967296) >>> 0;
    }
  }

  // Places the blue piece in the exit row, then scatters other pieces at random.
  function randomLayout(rng, others, maxLong, longP) {
    const occ = new Uint8Array(N * N);
    const pieces = [{ len: 2, horiz: true, line: EXIT_ROW }];
    const pos = [Math.floor(rng() * 3)];
    occ[EXIT_ROW * N + pos[0]] = 1;
    occ[EXIT_ROW * N + pos[0] + 1] = 1;
    let longs = 0;
    for (let tries = 0; pieces.length <= others && tries < 600; tries++) {
      const horiz = rng() < 0.5;
      const len = longs < maxLong && rng() < longP ? 3 : 2;
      const line = Math.floor(rng() * N);
      if (horiz && line === EXIT_ROW) continue;
      const p = Math.floor(rng() * (N - len + 1));
      let free = true;
      for (let k = 0; k < len && free; k++) {
        if (occ[horiz ? line * N + p + k : (p + k) * N + line]) free = false;
      }
      if (!free) continue;
      for (let k = 0; k < len; k++) occ[horiz ? line * N + p + k : (p + k) * N + line] = 1;
      pieces.push({ len, horiz, line });
      pos.push(p);
      if (len === 3) longs++;
    }
    return { pieces, pos };
  }

  function makeGraph(pieces) {
    const nb = pieces.length;
    const pw = new Float64Array(nb);
    const len = new Uint8Array(nb), hor = new Uint8Array(nb), line = new Uint8Array(nb);
    for (let i = 0; i < nb; i++) {
      pw[i] = i ? pw[i - 1] * 5 : 1;
      len[i] = pieces[i].len;
      hor[i] = pieces[i].horiz ? 1 : 0;
      line[i] = pieces[i].line;
    }
    return { nb, pw, len, hor, line, count: 0, states: null, keys: null, index: new Map() };
  }

  function keyOf(g, p) {
    let k = 0;
    for (let i = 0; i < g.nb; i++) k += p[i] * g.pw[i];
    return k;
  }

  function fillOcc(g, p, occ) {
    occ.fill(0);
    for (let i = 0; i < g.nb; i++) {
      const s = p[i], L = g.len[i];
      if (g.hor[i]) { const r = g.line[i] * N + s; for (let k = 0; k < L; k++) occ[r + k] = 1; }
      else { const c = g.line[i]; for (let k = 0; k < L; k++) occ[(s + k) * N + c] = 1; }
    }
  }

  // Calls fn(piece, newPos, newKey) for every legal slide (one piece, any distance).
  function eachMove(g, p, k, occ, fn) {
    for (let i = 0; i < g.nb; i++) {
      const s = p[i], L = g.len[i], w = g.pw[i];
      if (g.hor[i]) {
        const r = g.line[i] * N;
        for (let q = s - 1; q >= 0 && !occ[r + q]; q--) fn(i, q, k + (q - s) * w);
        for (let e = s + L; e < N && !occ[r + e]; e++) fn(i, e - L + 1, k + (e - L + 1 - s) * w);
      } else {
        const c = g.line[i];
        for (let q = s - 1; q >= 0 && !occ[q * N + c]; q--) fn(i, q, k + (q - s) * w);
        for (let e = s + L; e < N && !occ[e * N + c]; e++) fn(i, e - L + 1, k + (e - L + 1 - s) * w);
      }
    }
  }

  // Breadth-first enumeration of every arrangement reachable from start.
  function explore(pieces, start, cap) {
    const g = makeGraph(pieces);
    const nb = g.nb, index = g.index;
    let capacity = 2048;
    let states = new Uint8Array(capacity * nb);
    let keys = new Float64Array(capacity);
    let count = 0;
    const cur = new Uint8Array(nb);
    const add = (i, to, k) => {
      if (index.has(k)) return;
      if (count === capacity) {
        capacity *= 2;
        const s2 = new Uint8Array(capacity * nb); s2.set(states); states = s2;
        const k2 = new Float64Array(capacity); k2.set(keys); keys = k2;
      }
      const from = cur[i];
      cur[i] = to;
      states.set(cur, count * nb);
      cur[i] = from;
      keys[count] = k;
      index.set(k, count);
      count++;
    };
    for (let i = 0; i < nb; i++) cur[i] = start[i];
    states.set(cur, 0);
    keys[0] = keyOf(g, cur);
    index.set(keys[0], 0);
    count = 1;
    const occ = new Uint8Array(N * N);
    for (let h = 0; h < count; h++) {
      if (count > cap) return null;
      const b = h * nb;
      for (let i = 0; i < nb; i++) cur[i] = states[b + i];
      fillOcc(g, cur, occ);
      eachMove(g, cur, keys[h], occ, add);
    }
    g.count = count;
    g.states = states;
    g.keys = keys;
    return g;
  }

  // Minimum number of moves from every arrangement to a solved one.
  function distances(g) {
    const nb = g.nb, count = g.count, states = g.states, keys = g.keys, index = g.index;
    const dist = new Int16Array(count).fill(-1);
    const queue = new Int32Array(count);
    let qh = 0, qt = 0;
    for (let s = 0; s < count; s++) {
      if (states[s * nb] === GOAL) { dist[s] = 0; queue[qt++] = s; }
    }
    if (!qt) return null;
    const occ = new Uint8Array(N * N);
    const cur = new Uint8Array(nb);
    let nd = 0;
    const visit = (i, to, k) => {
      const t = index.get(k);
      if (dist[t] < 0) { dist[t] = nd; queue[qt++] = t; }
    };
    while (qh < qt) {
      const s = queue[qh++];
      for (let i = 0; i < nb; i++) cur[i] = states[s * nb + i];
      fillOcc(g, cur, occ);
      nd = dist[s] + 1;
      eachMove(g, cur, keys[s], occ, visit);
    }
    return dist;
  }

  function bestMove(g, dist, p) {
    const occ = new Uint8Array(N * N);
    fillOcc(g, p, occ);
    const k = keyOf(g, p);
    const at = g.index.get(k);
    if (at === undefined) return null;
    const here = dist[at];
    let best = null;
    eachMove(g, p, k, occ, (i, to, nk) => {
      if (best) return;
      const t = g.index.get(nk);
      if (t !== undefined && dist[t] === here - 1) best = { i, to, left: here };
    });
    return best;
  }
  // ENGINE END

  // min/max: accepted range of minimum moves. Hard keeps searching for boards
  // that need `goal` moves, longer when it is preparing the next board early.
  const LEVELS = {
    easy: { min: 4, max: 7, goal: 4, pieces: [7, 10], long: 2, longP: 0.28, preferMax: false, patience: 0, bgPatience: 0, budget: 1500 },
    normal: { min: 8, max: 13, goal: 8, pieces: [9, 12], long: 3, longP: 0.28, preferMax: false, patience: 0, bgPatience: 0, budget: 2500 },
    hard: { min: 15, max: 99, goal: 20, pieces: [10, 13], long: 4, longP: 0.28, preferMax: true, patience: 1200, bgPatience: 4000, budget: 6000 }
  };
  const CAP = 6000;
  const STORE_KEY = 'block-escape-level';
  const IDLE_TEXT = '블록을 밀어서 파란 블록을 오른쪽 출구로 빼내세요.';

  function attempt(cfg) {
    const rng = mulberry32(randomSeed());
    const n = cfg.pieces[0] + Math.floor(rng() * (cfg.pieces[1] - cfg.pieces[0] + 1));
    const lay = randomLayout(rng, n, cfg.long, cfg.longP);
    if (lay.pieces.length < cfg.pieces[0] + 1) return null;
    const g = explore(lay.pieces, lay.pos, CAP);
    if (!g) return null;
    const dist = distances(g);
    if (!dist) return null;
    let maxD = 0;
    for (let s = 0; s < g.count; s++) if (dist[s] > maxD) maxD = dist[s];
    if (maxD < 2) return null;
    const inRange = maxD >= cfg.min;
    let want = maxD;
    if (inRange && !cfg.preferMax) {
      const hi = Math.min(maxD, cfg.max);
      want = cfg.min + Math.floor(rng() * (hi - cfg.min + 1));
    }
    const cands = [];
    for (let s = 0; s < g.count; s++) if (dist[s] === want) cands.push(s);
    const pick = cands[Math.floor(rng() * cands.length)];
    const start = Array.from(g.states.subarray(pick * g.nb, pick * g.nb + g.nb));
    return { inRange, score: maxD, puzzle: { pieces: lay.pieces, start, min: want, g, dist } };
  }

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  // Samples random boards in short slices so the page stays responsive.
  async function generate(lv, token) {
    const cfg = LEVELS[lv];
    const t0 = performance.now();
    let best = null;
    for (;;) {
      const end = performance.now() + 10;
      do {
        const c = attempt(cfg);
        if (c) {
          if (c.inRange && (!cfg.preferMax || c.score >= cfg.goal)) return c.puzzle;
          if (!best || c.score > best.score) best = c;
        }
      } while (performance.now() < end);
      const spent = performance.now() - t0;
      const patience = token.hurry ? cfg.patience : cfg.bgPatience;
      if (best && ((best.inRange && spent > patience) || spent > cfg.budget)) return best.puzzle;
      await sleep(0);
      while (drag && !token.hurry && !token.cancelled) await sleep(80);
      if (token.cancelled) return null;
    }
  }

  const $ = (id) => document.getElementById(id);
  const gridEl = $('grid'), movesEl = $('moves'), minEl = $('min'), statusEl = $('status'), veilEl = $('veil');
  const undoBtn = $('undo'), resetBtn = $('reset'), hintBtn = $('hint'), newBtn = $('new');
  const levelBtns = Array.from(document.querySelectorAll('[data-level]'));
  const U = 100 / N;

  let level = 'normal';
  try {
    const saved = localStorage.getItem(STORE_KEY);
    if (saved && LEVELS[saved]) level = saved;
  } catch (e) { /* storage unavailable */ }

  let puzzle = null, pos = [], history = [], solved = false, busy = false;
  let els = [], ghost = null, hinted = -1, drag = null;
  let job = null, reqId = 0, busyTimer = 0;
  const cache = { easy: null, normal: null, hard: null };

  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const d = document.createElement('div');
      d.className = 'cell';
      d.style.left = c * U + '%';
      d.style.top = r * U + '%';
      gridEl.appendChild(d);
    }
  }

  function geom(el, pc) {
    if (pc.horiz) {
      el.style.left = '0';
      el.style.top = pc.line * U + '%';
      el.style.width = pc.len * U + '%';
      el.style.height = U + '%';
    } else {
      el.style.left = pc.line * U + '%';
      el.style.top = '0';
      el.style.width = U + '%';
      el.style.height = pc.len * U + '%';
    }
  }

  function shift(pc, p) {
    const t = (p * 100) / pc.len;
    return pc.horiz ? 'translate3d(' + t + '%,0,0)' : 'translate3d(0,' + t + '%,0)';
  }

  function setP(i, p) {
    els[i].style.transform = shift(puzzle.pieces[i], p);
  }

  function placeAll() {
    gridEl.classList.add('instant');
    for (let i = 0; i < els.length; i++) setP(i, pos[i]);
    void gridEl.offsetWidth;
    gridEl.classList.remove('instant');
  }

  function buildPieces() {
    for (const el of els) el.remove();
    els = puzzle.pieces.map((pc, i) => {
      const el = document.createElement('div');
      el.className = i === 0 ? 'piece target' : 'piece';
      el.dataset.i = String(i);
      el.setAttribute('aria-label', i === 0 ? '파란 블록' : '블록');
      el.appendChild(document.createElement('span'));
      geom(el, pc);
      el.addEventListener('pointerdown', onDown);
      gridEl.appendChild(el);
      return el;
    });
    placeAll();
  }

  function range(i) {
    const pc = puzzle.pieces[i];
    const occ = new Uint8Array(N * N);
    fillOcc(puzzle.g, pos, occ);
    const s = pos[i];
    let lo = s, hi = s;
    if (pc.horiz) {
      const r = pc.line * N;
      while (lo > 0 && !occ[r + lo - 1]) lo--;
      while (hi + pc.len < N && !occ[r + hi + pc.len]) hi++;
    } else {
      const c = pc.line;
      while (lo > 0 && !occ[(lo - 1) * N + c]) lo--;
      while (hi + pc.len < N && !occ[(hi + pc.len) * N + c]) hi++;
    }
    return [lo, hi];
  }

  function onDown(e) {
    if (drag || busy || solved || !puzzle) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const el = e.currentTarget;
    const i = Number(el.dataset.i);
    const pc = puzzle.pieces[i];
    const lim = range(i);
    const rect = gridEl.getBoundingClientRect();
    drag = {
      i, el, id: e.pointerId,
      origin: pc.horiz ? e.clientX : e.clientY,
      p0: pos[i], p: pos[i], lo: lim[0], hi: lim[1],
      cell: rect.width / N || 1
    };
    el.classList.add('dragging');
    try { el.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
    e.preventDefault();
  }

  function onMove(e) {
    if (!drag || e.pointerId !== drag.id) return;
    const pc = puzzle.pieces[drag.i];
    let p = drag.p0 + ((pc.horiz ? e.clientX : e.clientY) - drag.origin) / drag.cell;
    if (p < drag.lo) p = drag.lo;
    else if (p > drag.hi) p = drag.hi;
    drag.p = p;
    setP(drag.i, p);
  }

  function onUp(e) {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag;
    drag = null;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
    d.el.classList.remove('dragging');
    const to = Math.round(d.p);
    setP(d.i, to);
    if (to !== d.p0) commit(d.i, d.p0, to);
  }

  function commit(i, from, to) {
    pos[i] = to;
    history.push([i, from, to]);
    clearHint();
    if (i === 0 && to === GOAL) { win(); return; }
    setStatus(IDLE_TEXT);
    sync();
  }

  function win() {
    solved = true;
    const moves = history.length, min = puzzle.min;
    sync();
    setStatus(moves <= min
      ? '탈출 성공! 최소 이동 ' + min + '번으로 풀었어요.'
      : '탈출 성공! ' + moves + '번 만에 풀었어요. 최소 이동은 ' + min + '번이에요.', true);
    const el = els[0];
    setTimeout(() => {
      if (!solved || els[0] !== el) return;
      el.classList.add('exiting');
      setP(0, N + 1);
    }, 170);
  }

  function undo() {
    if (drag || busy || solved || !history.length) return;
    const last = history.pop();
    pos[last[0]] = last[1];
    setP(last[0], last[1]);
    clearHint();
    setStatus(IDLE_TEXT);
    sync();
  }

  function reset() {
    if (drag || busy || !puzzle) return;
    solved = false;
    history = [];
    pos = puzzle.start.slice();
    els[0].classList.remove('exiting');
    clearHint();
    placeAll();
    setStatus(IDLE_TEXT);
    sync();
  }

  function showHint() {
    if (drag || busy || solved || !puzzle) return;
    const mv = bestMove(puzzle.g, puzzle.dist, pos);
    if (!mv) return;
    clearHint();
    const pc = puzzle.pieces[mv.i];
    ghost = document.createElement('div');
    ghost.className = 'ghost';
    geom(ghost, pc);
    ghost.style.transform = shift(pc, mv.to);
    gridEl.appendChild(ghost);
    hinted = mv.i;
    els[mv.i].classList.add('hinted');
    setStatus('테두리 표시된 블록을 점선 자리로 옮겨 보세요. 남은 최소 이동은 ' + mv.left + '번이에요.');
  }

  function clearHint() {
    if (ghost) { ghost.remove(); ghost = null; }
    if (hinted >= 0 && els[hinted]) els[hinted].classList.remove('hinted');
    hinted = -1;
  }

  function setStatus(msg, strong) {
    statusEl.textContent = msg;
    statusEl.classList.toggle('strong', !!strong);
  }

  function sync() {
    movesEl.textContent = String(history.length);
    minEl.textContent = puzzle ? String(puzzle.min) : '–';
    undoBtn.disabled = busy || solved || !history.length;
    resetBtn.disabled = busy || !puzzle || (!history.length && !solved);
    hintBtn.disabled = busy || solved || !puzzle;
    newBtn.disabled = busy;
    for (const b of levelBtns) b.setAttribute('aria-pressed', String(b.dataset.level === level));
  }

  function setBusy(b) {
    busy = b;
    clearTimeout(busyTimer);
    if (b) busyTimer = setTimeout(() => veilEl.classList.add('show'), 150);
    else veilEl.classList.remove('show');
    sync();
  }

  function startJob(lv, hurry) {
    const token = { cancelled: false, hurry: !!hurry };
    const j = { level: lv, token, promise: null };
    j.promise = generate(lv, token).then((pz) => {
      if (!token.cancelled && pz) cache[lv] = pz;
      if (job === j) job = null;
      return pz;
    });
    job = j;
    return j;
  }

  // Builds the next board for the current level in the background.
  function prefetch() {
    if (!job && !cache[level]) startJob(level);
  }

  function load(pz) {
    clearHint();
    puzzle = pz;
    pos = pz.start.slice();
    history = [];
    solved = false;
    buildPieces();
    setStatus(IDLE_TEXT);
    sync();
  }

  async function newGame() {
    const my = ++reqId;
    const lv = level;
    if (!cache[lv]) {
      setBusy(true);
      let j = job;
      if (!j || j.level !== lv) {
        if (j) j.token.cancelled = true;
        j = startJob(lv, true);
      }
      j.token.hurry = true;
      await j.promise;
      if (my !== reqId) return;
      setBusy(false);
      if (!cache[lv]) { newGame(); return; }
    }
    const pz = cache[lv];
    cache[lv] = null;
    load(pz);
    setTimeout(prefetch, 300);
  }

  function setLevel(lv) {
    if (!LEVELS[lv] || lv === level) return;
    level = lv;
    try { localStorage.setItem(STORE_KEY, lv); } catch (e) { /* storage unavailable */ }
    sync();
    newGame();
  }

  for (const b of levelBtns) b.addEventListener('click', () => setLevel(b.dataset.level));
  undoBtn.addEventListener('click', undo);
  resetBtn.addEventListener('click', reset);
  hintBtn.addEventListener('click', showHint);
  newBtn.addEventListener('click', () => { if (!busy) newGame(); });
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && !e.shiftKey && (e.key === 'z' || e.key === 'Z')) {
      e.preventDefault();
      undo();
    }
  });

  sync();
  newGame();
})();
</script>
</body>
</html>
